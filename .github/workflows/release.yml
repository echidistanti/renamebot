# Crea una release in bozza con installer e zip per Windows e AppImage per Linux.
# Si avvia con un tag vX.Y.Z oppure a mano da Actions indicando la versione;
# nel secondo caso il tag nasce quando si pubblica la bozza.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versione senza la v iniziale (es. 0.1.0)"
        required: true

env:
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Zip portabile e installer
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\bobina.exe, LICENSE, README.md -DestinationPath "dist\Bobina-$v-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" packaging\bobina.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo build --release
      - name: AppImage
        run: |
          v="${TAG#v}"
          mkdir -p AppDir/usr/bin dist
          cp target/release/bobina AppDir/usr/bin/
          cp packaging/bobina.desktop assets/bobina.png AppDir/
          ln -s usr/bin/bobina AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/Bobina-$v-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Bobina ${{ env.TAG }}
          draft: true
          files: dist/*
